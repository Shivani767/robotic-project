<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROBOT CI — Automated Policy Testing &amp; Behavioral Boundary Discovery</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <!-- ================= Top navigation ================= -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="8" width="10" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="10" cy="12" r="1" fill="currentColor"/><circle cx="14" cy="12" r="1" fill="currentColor"/>
          <path d="M12 8V4M9 4h6" stroke="currentColor" stroke-width="1.4" fill="none"/>
          <path d="M7 10H4M17 10h3" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">ROBOT CI</span>
          <span class="brand-sub">Automated Policy Testing &amp; Behavioral Boundary Discovery</span>
        </div>
      </div>

      <nav class="mainnav" id="mainnav" aria-label="Primary">
        <button class="nav-item active" data-view="overview">Overview</button>
        <button class="nav-item" data-view="discovery">Discovery</button>
        <button class="nav-item" data-view="boundary">Boundary Map</button>
        <button class="nav-item" data-view="comparison">Policy Comparison</button>
        <button class="nav-item" data-view="results">Results</button>
        <button class="nav-item" data-view="logs">Logs</button>
      </nav>

      <div class="status-area">
        <div class="status-line">
          <span class="status-k">Simulator</span>
          <span class="status-v" id="status-sim">MuJoCo</span>
        </div>
        <div class="status-line">
          <span class="status-k">Evidence</span>
          <span class="status-v mono" id="status-rev">—</span>
        </div>
        <div class="mode-badge" id="mode-badge" title="Replays recorded evidence; not connected to a running simulator.">
          <span class="dot"></span><span id="mode-label">RECORDED EXPERIMENT</span>
        </div>
      </div>
    </header>

    <main class="console" id="console">
      <!-- Body injected by viewer.js -->
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="viewer.js?v=3"></script>
  </body>
</html>
